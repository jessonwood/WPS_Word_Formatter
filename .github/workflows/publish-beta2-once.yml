name: Publish v0.9.0-beta.2 once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-beta2-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove one-time workflow and create release tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-beta2-once.yml
          git commit -m "chore: finalize v0.9.0-beta.2 release"
          git tag -a v0.9.0-beta.2 -m "WPS Word Formatter v0.9.0-beta.2"
          git push origin HEAD:main
          git push origin v0.9.0-beta.2
