name: Apply v1.0.2 table cell indent fix once

on:
  push:
    branches:
      - 'fix/v1.0.2-table-cell-indent'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/v1.0.2-table-cell-indent
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply table cell indentation safety changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:160]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Planning type: table paragraph indent is a first-class table change.
          replace_once(
              'src/modules/wordFormatter/types/planning.ts',
              "  | 'table-column-align'\n",
              "  | 'table-column-align'\n  | 'table-paragraph-indent'\n"
          )

          # 2) Planner: table-cell paragraphs must never enter body/heading paragraph planning.
          planner = Path('src/modules/wordFormatter/core/planning/FormatPlanBuilder.ts')
          text = planner.read_text(encoding='utf-8')
          old = """    document.paragraphs.forEach(p => {
      const pIdx = p.index
"""
          new = """    document.paragraphs.forEach(p => {
      // Table-cell paragraphs belong exclusively to TableFormatter. Treating them as
      // ordinary body paragraphs would apply template.body.firstLineIndentChars (2 chars).
      if (p.tableIndex !== undefined) return

      const pIdx = p.index
"""
          if old not in text:
              raise SystemExit('Failed to insert table paragraph exclusion into FormatPlanBuilder')
          text = text.replace(old, new, 1)

          old = """      document.tables.forEach(table => {
        const tChanges = FormatComparator.compareTable(table, template.table)
        if (tChanges.length > 0) {
          affectedTables++
          changes.push(...tChanges)
        }
      })
"""
          new = """      document.tables.forEach(table => {
        const tChanges = FormatComparator.compareTable(table, template.table)

        // WPS table-cell text is still exposed through Document.Paragraphs. If an older
        // run already applied body indentation to those paragraphs, surface one table-level
        // repair so minimal mode invokes TableFormatter and resets the cell paragraph indents.
        const tableParagraphs = document.paragraphs.filter(p => p.tableIndex === table.index)
        const hasParagraphIndent = tableParagraphs.some(p => {
          const firstLine = p.firstLineIndentChars ?? p.firstLineIndent ?? 0
          const left = p.leftIndent ?? 0
          const right = p.rightIndent ?? 0
          return Math.abs(firstLine) > 0.01 || Math.abs(left) > 0.01 || Math.abs(right) > 0.01
        })

        if (hasParagraphIndent) {
          tChanges.push({
            id: `table-${table.index}-paragraph-indent`,
            targetType: 'table',
            targetIndex: table.index,
            property: 'table-paragraph-indent',
            propertyName: '表格单元格段落缩进',
            before: '存在非零首行/左右缩进',
            after: '首行/左右缩进均为 0',
            reason: '表格内部段落不得继承正文首行缩进，统一由表格格式化负责',
            category: 'table',
            enabled: true,
            impact: 'low'
          })
        }

        if (tChanges.length > 0) {
          affectedTables++
          changes.push(...tChanges)
        }
      })
"""
          if old not in text:
              raise SystemExit('Failed to add table paragraph indent repair planning')
          planner.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 3) Executor defense-in-depth: stale/custom plans cannot send table cells through ParagraphFormatter.
          engine = Path('src/modules/wordFormatter/core/formatting/FormatEngine.ts')
          text = engine.read_text(encoding='utf-8')
          old = """        for (const [pIdx, pChanges] of pMap) {
          const rec = recognition.find(r => r.paragraphIndex === pIdx)
"""
          new = """        for (const [pIdx, pChanges] of pMap) {
          const paragraphModel = document.paragraphs.find(p => p.index === pIdx)
          if (paragraphModel?.tableIndex !== undefined) {
            logger.warn('FormatEngine', `Skipped paragraph formatting for table-cell paragraph P${pIdx} (table ${paragraphModel.tableIndex})`)
            processedP++
            continue
          }

          const rec = recognition.find(r => r.paragraphIndex === pIdx)
"""
          if old not in text:
              raise SystemExit('Failed to add minimal-mode table paragraph guard')
          text = text.replace(old, new, 1)

          old = """          for (let i = 0; i < totalP; i++) {
            const p = document.paragraphs[i]
            const rec = recognition.find(r => r.paragraphIndex === p.index) || {
"""
          new = """          for (let i = 0; i < totalP; i++) {
            const p = document.paragraphs[i]

            // Table contents are formatted only by TableFormatter. Do not let the default
            // body role apply a two-character first-line indent inside table cells.
            if (p.tableIndex !== undefined) {
              continue
            }

            const rec = recognition.find(r => r.paragraphIndex === p.index) || {
"""
          if old not in text:
              raise SystemExit('Failed to add normalize-mode table paragraph guard')
          engine.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 4) WPS adapter: normalize table-cell paragraph indents to zero at the table layer.
          adapter = Path('src/modules/wordFormatter/adapters/WpsWriterAdapter.ts')
          text = adapter.read_text(encoding='utf-8')
          old = """      }

      // 2. Table Header Formatting & Cross-Page Repeat
      if (table.Rows && table.Rows.Count > 0) {
"""
          new = """      }

      // 1b. Table paragraph isolation. Table cells must not inherit body paragraph indents.
      // Set both character-unit and point-unit properties because WPS builds differ in which
      // paragraph-format property is writable for a multi-cell table range.
      if (tRange && tRange.ParagraphFormat) {
        const tpf = tRange.ParagraphFormat
        try { tpf.CharacterUnitFirstLineIndent = 0 } catch {}
        try { tpf.FirstLineIndent = 0 } catch {}
        try { tpf.CharacterUnitLeftIndent = 0 } catch {}
        try { tpf.LeftIndent = 0 } catch {}
        try { tpf.CharacterUnitRightIndent = 0 } catch {}
        try { tpf.RightIndent = 0 } catch {}
      }

      // 2. Table Header Formatting & Cross-Page Repeat
      if (table.Rows && table.Rows.Count > 0) {
"""
          if old not in text:
              raise SystemExit('Failed to add table paragraph indent reset to WpsWriterAdapter')
          adapter.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 5) Changelog: keep v1.0.2 release notes aligned with the real fix set.
          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          anchor = '- 清理扫描器与清理执行器双重保护表格内部段落、表格前后结构锚点，禁止删除或改写这些段落。\n'
          addition = anchor + '- 修复表格单元格文字被正文规则套用首行缩进 2 字符的问题；表格内部段落与正文排版链路隔离，并由表格格式化统一清零首行/左右缩进。\n'
          if anchor not in text:
              raise SystemExit('Failed to locate v1.0.2 changelog anchor')
          changelog.write_text(text.replace(anchor, addition, 1), encoding='utf-8')
          PY

      - name: Add regression tests
        shell: bash
        run: |
          cat > tests/v102TableIndentSafety.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest'
          import { readFileSync } from 'node:fs'
          import { resolve } from 'node:path'
          import { FormatPlanBuilder } from '../src/modules/wordFormatter/core/planning/FormatPlanBuilder'
          import { FormatEngine } from '../src/modules/wordFormatter/core/formatting/FormatEngine'
          import { regulationTemplate } from '../src/modules/wordFormatter/templates/documentProcessing2025'
          import type { DocumentModel, ParagraphModel, TableModel } from '../src/modules/wordFormatter/types/document'
          import type { FormatPlan } from '../src/modules/wordFormatter/types/planning'

          function paragraph(index: number, text: string, tableIndex?: number, firstLineIndentChars = 0): ParagraphModel {
            return {
              index,
              text,
              rawText: text,
              normalizedText: text,
              rangeStart: (index - 1) * 100,
              rangeEnd: index * 100,
              alignment: 'left',
              fontSize: 16,
              chineseFont: '仿宋_GB2312',
              westernFont: 'Times New Roman',
              bold: false,
              firstLineIndentChars,
              leftIndent: 0,
              rightIndent: 0,
              hasImage: false,
              hasShape: false,
              hasField: false,
              hasBookmark: false,
              hasCommentReference: false,
              isEmpty: false,
              tableIndex
            }
          }

          function makeDoc(tableIndent = 2): DocumentModel {
            const paragraphs = [
              paragraph(1, '这是表格外正文。', undefined, 0),
              paragraph(2, '业务分类', 1, tableIndent),
              paragraph(3, '风险客户退出标准', 1, tableIndent)
            ]
            const tables: TableModel[] = [{
              index: 1,
              rangeStart: 100,
              rangeEnd: 300,
              rowCount: 2,
              columnCount: 2
            }]
            return {
              id: 'v102-table-indent',
              name: 'v102-table-indent.docx',
              signature: 'sig',
              paragraphCount: paragraphs.length,
              tableCount: 1,
              sectionCount: 1,
              paragraphs,
              tables,
              sections: [{ index: 1, orientation: 'portrait' }],
              metadata: {}
            }
          }

          class Adapter {
            paragraphStyles: number[] = []
            granularParagraphs: number[] = []
            tableStyles: number[] = []

            async setScreenUpdating(_value: boolean) {}
            async applyPageSettings(_settings: any) {}
            async applyGranularSectionChanges(_index: number, _changes: any[]) {}
            async applyGranularParagraphChanges(index: number, _changes: any[], _style: any) { this.granularParagraphs.push(index) }
            async applyParagraphStyle(index: number, _style: any) { this.paragraphStyles.push(index) }
            async applyRangeStyle(_index: number, _start: number, _end: number, _style: any) {}
            async applyOutlineLevel(_index: number, _level: number) {}
            async applyTableStyle(index: number, _style: any) { this.tableStyles.push(index) }
            async getDocumentTextSignature() { return 'sig' }
          }

          describe('v1.0.2 table-cell paragraph indentation safety', () => {
            it('excludes table-cell paragraphs from paragraph plans and creates a table-level indent repair', () => {
              const doc = makeDoc(2)
              const plan = FormatPlanBuilder.buildPlan({
                document: doc,
                recognition: [],
                template: regulationTemplate,
                strategy: 'minimal',
                scope: 'all'
              })

              expect(plan.changes.some(change => change.targetType === 'paragraph' && change.targetIndex === 2)).toBe(false)
              expect(plan.changes.some(change => change.targetType === 'paragraph' && change.targetIndex === 3)).toBe(false)
              expect(plan.changes.some(change =>
                change.targetType === 'table' &&
                change.targetIndex === 1 &&
                change.property === 'table-paragraph-indent'
              )).toBe(true)
            })

            it('normalize mode formats outside body paragraphs but never table-cell paragraphs', async () => {
              const doc = makeDoc(2)
              const adapter = new Adapter()
              const result = await new FormatEngine(adapter as any).execute({
                document: doc,
                recognition: [],
                template: regulationTemplate,
                strategy: 'normalize',
                scope: 'all'
              })

              expect(result.success).toBe(true)
              expect(adapter.paragraphStyles).toContain(1)
              expect(adapter.paragraphStyles).not.toContain(2)
              expect(adapter.paragraphStyles).not.toContain(3)
              expect(adapter.tableStyles).toContain(1)
            })

            it('minimal mode ignores stale paragraph changes that target a table cell', async () => {
              const doc = makeDoc(2)
              const adapter = new Adapter()
              const stalePlan: FormatPlan = {
                documentId: doc.id,
                documentSignature: doc.signature,
                createdAt: Date.now(),
                strategy: 'minimal',
                scope: 'all',
                changes: [{
                  id: 'stale-table-cell-body-indent',
                  targetType: 'paragraph',
                  targetIndex: 2,
                  property: 'first-line-indent',
                  propertyName: '首行缩进',
                  before: 0,
                  after: 2,
                  reason: '旧计划模拟',
                  category: 'body',
                  enabled: true,
                  impact: 'low'
                }],
                summary: {
                  totalChanges: 1,
                  enabledChanges: 1,
                  pageChanges: 0,
                  headingChanges: 0,
                  bodyChanges: 1,
                  tableChanges: 0,
                  fontChanges: 0,
                  outlineChanges: 0,
                  affectedParagraphs: 1,
                  affectedTables: 0,
                  skippedAlreadyCompliant: 0
                }
              }

              const result = await new FormatEngine(adapter as any).execute({
                document: doc,
                recognition: [],
                template: regulationTemplate,
                strategy: 'minimal',
                scope: 'all',
                plan: stalePlan
              })

              expect(result.success).toBe(true)
              expect(adapter.granularParagraphs).not.toContain(2)
            })

            it('WPS table formatter explicitly resets first-line, left and right paragraph indents', () => {
              const source = readFileSync(resolve(process.cwd(), 'src/modules/wordFormatter/adapters/WpsWriterAdapter.ts'), 'utf8')
              expect(source).toContain('tpf.CharacterUnitFirstLineIndent = 0')
              expect(source).toContain('tpf.FirstLineIndent = 0')
              expect(source).toContain('tpf.CharacterUnitLeftIndent = 0')
              expect(source).toContain('tpf.LeftIndent = 0')
              expect(source).toContain('tpf.CharacterUnitRightIndent = 0')
              expect(source).toContain('tpf.RightIndent = 0')
            })
          })
          EOF

      - name: Validate
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Commit patched source and tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests CHANGELOG.md
          git commit -m "fix: isolate table cells from body indentation"
          git push origin HEAD:fix/v1.0.2-table-cell-indent
