name: Publish v1.0.0 tag once

on:
  push:
    branches: [release-tag-v1.0.0]
    paths: ['.github/workflows/publish-v1-tag-once.yml']

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main release commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Create and push stable tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v1.0.0 -m 'WPS Word Formatter v1.0.0'
          git push origin v1.0.0
