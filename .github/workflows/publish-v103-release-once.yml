name: Publish v1.0.3 release once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v103-release-once.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout v1.0.3
        uses: actions/checkout@v4
        with:
          ref: v1.0.3
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Validate
        shell: pwsh
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Build release archive
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne '1.0.3') { throw "Expected version 1.0.3, got $version" }
          $stageRoot = Join-Path $PWD "release-stage"
          $addonStage = Join-Path $stageRoot "WpsWordFormatter_$version"
          $scriptsStage = Join-Path $stageRoot "scripts"

          New-Item -ItemType Directory -Path $addonStage -Force | Out-Null
          New-Item -ItemType Directory -Path $scriptsStage -Force | Out-Null

          Copy-Item "dist\*" $addonStage -Recurse -Force
          Copy-Item "install_release.bat" $stageRoot -Force
          Copy-Item "uninstall_offline.bat" $stageRoot -Force
          Copy-Item "scripts\install-prebuilt.ps1" $scriptsStage -Force
          Copy-Item "scripts\uninstall-offline.ps1" $scriptsStage -Force
          Copy-Item "LICENSE" $stageRoot -Force
          Copy-Item "THIRD_PARTY_NOTICES.md" $stageRoot -Force
          Copy-Item "README.md" $stageRoot -Force

          Compress-Archive -Path "$stageRoot\*" -DestinationPath "wps-word-formatter-$version.zip" -Force
          $hash = (Get-FileHash "wps-word-formatter-$version.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  wps-word-formatter-$version.zip" | Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: WPS Word Formatter v1.0.3
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            wps-word-formatter-1.0.3.zip
            SHA256SUMS.txt
