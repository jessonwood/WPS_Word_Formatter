name: Apply v1.0.1 fixes once

on:
  push:
    branches:
      - 'feature/v1.0.1'
    paths:
      - '.github/workflows/apply-v1.0.1-fixes-once.yml'
      - 'scripts/apply-v101-fixes.mjs'
      - 'scripts/fix-v101-internal-space.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: |
          node scripts/apply-v101-fixes.mjs
          node scripts/fix-v101-internal-space.mjs
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit patched v1.0.1 branch
        shell: bash
        run: |
          git checkout -- .github/workflows/ci.yml .github/workflows/apply-v1.0.1-fixes-once.yml scripts/apply-v101-fixes.mjs scripts/fix-v101-internal-space.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve structural spaces and support inline clause headings'
          git push origin feature/v1.0.1
