name: Apply v1.0.2 safety fix once

on:
  push:
    branches:
      - 'feature/v1.0.2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v1.0.2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply v1.0.2 safety changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) One-click formatting must never run document cleanup automatically.
          store = Path('src/modules/wordFormatter/stores/wordFormatterStore.ts')
          text = store.read_text(encoding='utf-8')
          pattern = re.compile(r"    async executeSmartFormat\(\) \{.*?\n    \},\n\n    setSelectedTemplate", re.S)
          replacement = """    async executeSmartFormat() {
              if (!this.documentModel) await this.scanDocument()
              if (!this.documentModel) return

              // v1.0.2 safety policy: formatting never mutates document text through cleanup.
              // Cleanup remains an explicit manual tool and must be initiated by the user.
              logger.info('WordFormatterStore', 'Smart flow: automatic cleanup disabled; formatting only')
              await this.executeFormat()
            },

            setSelectedTemplate"""
          text2, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Failed to patch executeSmartFormat')
          store.write_text(text2, encoding='utf-8')

          # 2) UI wording must match the new behavior.
          page = Path('src/modules/wordFormatter/WordFormatterPage.vue')
          text = page.read_text(encoding='utf-8')
          text = text.replace("case 'body-only': return '一键仅修正文与空行'", "case 'body-only': return '一键仅修正文'")
          text = text.replace("default: return '一键整理并排版'", "default: return '一键排版'")
          text = text.replace('WPS Writer JS Add-in v1.0</span>', 'WPS Writer JS Add-in v1.0.2</span>')
          page.write_text(text, encoding='utf-8')

          # 3) Correlate paragraphs that physically belong to a table before cleanup/audit.
          table_scanner = Path('src/modules/wordFormatter/core/scanner/TableScanner.ts')
          text = table_scanner.read_text(encoding='utf-8')
          old = """      for (let i = 0; i < paragraphs.length; i++) {
        const p = paragraphs[i]
        if (p.rangeEnd <= table.rangeStart) {
          prevIdx = p.index
        } else if (p.rangeStart >= table.rangeEnd && nextIdx === undefined) {
          nextIdx = p.index
          break
        }
      }
"""
          new = """      for (let i = 0; i < paragraphs.length; i++) {
        const p = paragraphs[i]
        const overlapsTable = p.rangeStart < table.rangeEnd && p.rangeEnd > table.rangeStart

        if (overlapsTable) {
          p.tableIndex = table.index
          continue
        }

        if (p.rangeEnd <= table.rangeStart) {
          prevIdx = p.index
        } else if (p.rangeStart >= table.rangeEnd && nextIdx === undefined) {
          nextIdx = p.index
          break
        }
      }
"""
          if old not in text:
              raise SystemExit('Failed to locate TableScanner correlation loop')
          table_scanner.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 4) Cleanup scanner: protect table contents and the exact outside paragraphs adjacent to tables.
          cleanup = Path('src/modules/wordFormatter/core/cleanup/CleanupScanner.ts')
          text = cleanup.read_text(encoding='utf-8')
          marker = """    const paragraphs = doc.paragraphs || []
    const pCount = paragraphs.length

    logger.info"""
          insert = """    const paragraphs = doc.paragraphs || []
    const pCount = paragraphs.length

    // Table boundary paragraphs are structural anchors in WPS. Deleting them can pull a
    // caption/body paragraph into the first table cell. Never offer cleanup for these anchors.
    const protectedTableParagraphs = new Set<number>()
    for (const table of doc.tables || []) {
      if (table.previousParagraphIndex !== undefined) protectedTableParagraphs.add(table.previousParagraphIndex)
      if (table.nextParagraphIndex !== undefined) protectedTableParagraphs.add(table.nextParagraphIndex)
    }

    logger.info"""
          if marker not in text:
              raise SystemExit('Failed to insert protected table paragraph set')
          text = text.replace(marker, insert, 1)

          flush_pattern = re.compile(r"    const flushEmptyGroup = \(\) => \{.*?\n    \}\n\n    for \(let i = 0; i < pCount; i\+\+\) \{", re.S)
          flush_replacement = """    const flushEmptyGroup = () => {
      if (currentEmptyGroup.length === 0) return

      const group = currentEmptyGroup
      currentEmptyGroup = []
      const candidates = group.filter(p => p.tableIndex === undefined && !protectedTableParagraphs.has(p.index))
      const groupLen = candidates.length
      if (groupLen === 0) return

      if (groupLen === 1) {
        const p = candidates[0]
        issues.push({
          id: `cleanup-blank-${p.index}`,
          type: 'blank-line',
          paragraphIndex: p.index,
          rangeStart: p.rangeStart,
          rangeEnd: p.rangeEnd,
          originalText: p.rawText || p.text || '',
          suggestedText: '',
          reason: '空白段落（仅手动清理；自动排版不会删除）',
          severity: 'info',
          enabled: true,
          safeAutoFix: false
        })
      } else {
        candidates.forEach((p, idx) => {
          issues.push({
            id: `cleanup-blank-${p.index}`,
            type: 'multiple-blank-lines',
            paragraphIndex: p.index,
            rangeStart: p.rangeStart,
            rangeEnd: p.rangeEnd,
            originalText: p.rawText || p.text || '',
            suggestedText: '',
            reason: `连续空行 (第 ${idx + 1}/${groupLen} 行)，仅允许用户手动确认清理`,
            severity: 'info',
            enabled: true,
            safeAutoFix: false
          })
        })
      }
    }

    for (let i = 0; i < pCount; i++) {"""
          text2, count = flush_pattern.subn(flush_replacement, text, count=1)
          if count != 1:
              raise SystemExit('Failed to replace flushEmptyGroup')
          text = text2

          old = """      const isEmpty = p.isEmpty || cleaned.length === 0

      // 1. Check Blank Lines
      if (isEmpty) {"""
          new = """      const isEmpty = p.isEmpty || cleaned.length === 0

      // Never mutate table-cell paragraphs or the exact paragraphs adjacent to a table.
      // In WPS these ranges can carry structural paragraph marks used to keep captions outside tables.
      if (p.tableIndex !== undefined || protectedTableParagraphs.has(p.index)) {
        flushEmptyGroup()
        continue
      }

      // 1. Check Blank Lines
      if (isEmpty) {"""
          if old not in text:
              raise SystemExit('Failed to add per-paragraph table protection')
          text = text.replace(old, new, 1)

          # v1.0.2 policy: cleanup is always explicit/manual. No issue is eligible for one-click auto-fix.
          text = text.replace('safeAutoFix: true', 'safeAutoFix: false')
          cleanup.write_text(text, encoding='utf-8')

          # 5) Executor defense-in-depth: even stale/custom cleanup issues cannot delete table anchors/cells.
          executor = Path('src/modules/wordFormatter/core/cleanup/CleanupExecutor.ts')
          text = executor.read_text(encoding='utf-8')
          marker = """    const expectedChanges: ExpectedTextChange[] = []
    const paragraphs = doc.paragraphs || []

    for (const p of paragraphs) {"""
          replacement = """    const expectedChanges: ExpectedTextChange[] = []
    const paragraphs = doc.paragraphs || []
    const protectedTableParagraphs = new Set<number>()
    for (const table of doc.tables || []) {
      if (table.previousParagraphIndex !== undefined) protectedTableParagraphs.add(table.previousParagraphIndex)
      if (table.nextParagraphIndex !== undefined) protectedTableParagraphs.add(table.nextParagraphIndex)
    }

    for (const p of paragraphs) {
      if (p.tableIndex !== undefined || protectedTableParagraphs.has(p.index)) {
        logger.warn('CleanupExecutor', `Skipped cleanup for protected table paragraph P${p.index}`)
        continue
      }"""
          if marker not in text:
              raise SystemExit('Failed to patch CleanupExecutor protection')
          executor.write_text(text.replace(marker, replacement, 1), encoding='utf-8')

          # 6) CI should build a v1.0.2 release candidate on the new branch/PR.
          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text(encoding='utf-8')
          text = text.replace("      - 'feature/v1.0.1'\n", "      - 'feature/v1.0.1'\n      - 'feature/v1.0.2'\n", 1)
          text = text.replace(
              "github.ref == 'refs/heads/feature/v1.0.1' || github.head_ref == 'feature/v1.0.1'",
              "github.ref == 'refs/heads/feature/v1.0.1' || github.head_ref == 'feature/v1.0.1' || github.ref == 'refs/heads/feature/v1.0.2' || github.head_ref == 'feature/v1.0.2'"
          )
          text = text.replace('name: wps-word-formatter-v1.0.1-release-candidate', 'name: wps-word-formatter-v1.0.2-release-candidate')
          ci.write_text(text, encoding='utf-8')

          # 7) Release metadata/docs.
          manifest = Path('public/manifest.xml')
          manifest.write_text(manifest.read_text(encoding='utf-8').replace('<version>1.0.1</version>', '<version>1.0.2</version>'), encoding='utf-8')

          publish = Path('publish.xml')
          publish.write_text(publish.read_text(encoding='utf-8').replace('1.0.1', '1.0.2'), encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('`v1.0.1`', '`v1.0.2`', 1)
          text = text.replace('v1.0 聚焦“选模板/接受推荐 → 扫描 → 预览 → 一键整理并排版”的简单使用流程；高级设置仍保留但默认收起。',
                              'v1.0.2 聚焦“选模板/接受推荐 → 扫描 → 预览 → 一键排版”；自动排版不再执行任何文档清理，清理功能仅保留为用户显式手动操作。')
          readme.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          entry = """## [1.0.2] - 2026-08-18

### Fixed
- 修复表格标题附近空段落被删除后，WPS 将独立表格标题吸入表格首行/首单元格的结构破坏问题。
- 扫描阶段标记表格内部段落，并保护表格前后直接相邻的结构段落。
- 清理执行器增加二次防护：表格内部及表格边界段落即使收到旧/自定义清理任务也不会执行删除或文本替换。

### Changed
- “一键排版”不再自动执行任何文档清理；所有清理项都改为用户显式手动操作。
- 主操作按钮由“一键整理并排版”调整为“一键排版”，避免误导。

"""
          if '## [1.0.2]' not in text:
              text = text.replace('## [1.0.1]', entry + '## [1.0.1]', 1)
          changelog.write_text(text, encoding='utf-8')
          PY

          npm version 1.0.2 --no-git-tag-version

      - name: Add regression tests
        shell: bash
        run: |
          cat > tests/v102TableSafety.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest'
          import { readFileSync } from 'node:fs'
          import { resolve } from 'node:path'
          import { CleanupScanner } from '../src/modules/wordFormatter/core/cleanup/CleanupScanner'
          import { CleanupExecutor } from '../src/modules/wordFormatter/core/cleanup/CleanupExecutor'
          import { TableScanner } from '../src/modules/wordFormatter/core/scanner/TableScanner'
          import type { DocumentModel, ParagraphModel, TableModel } from '../src/modules/wordFormatter/types/document'

          function p(index: number, text: string, start: number, end: number): ParagraphModel {
            return {
              index,
              text,
              rawText: text,
              normalizedText: text,
              rangeStart: start,
              rangeEnd: end,
              alignment: 'left',
              hasImage: false,
              hasShape: false,
              hasField: false,
              hasBookmark: false,
              hasCommentReference: false,
              isEmpty: text.trim().length === 0
            }
          }

          function doc(paragraphs: ParagraphModel[], tables: TableModel[]): DocumentModel {
            return {
              id: 'v102',
              name: 'v102.docx',
              paragraphCount: paragraphs.length,
              tableCount: tables.length,
              sectionCount: 1,
              paragraphs,
              tables,
              sections: [{ index: 1, orientation: 'portrait' }],
              metadata: {},
              signature: 'sig'
            }
          }

          describe('v1.0.2 table-boundary safety', () => {
            it('marks table-contained paragraphs and finds outside neighbors', async () => {
              const paragraphs = [p(1, '表1 标题', 0, 10), p(2, '表格单元格', 20, 30), p(3, '注：', 40, 50)]
              const adapter = {
                readTables: async () => [{ index: 1, rangeStart: 15, rangeEnd: 35, rowCount: 1, columnCount: 1 }]
              } as any

              const tables = await new TableScanner(adapter).scan(paragraphs)
              expect(paragraphs[1].tableIndex).toBe(1)
              expect(tables[0].previousParagraphIndex).toBe(1)
              expect(tables[0].nextParagraphIndex).toBe(3)
            })

            it('never offers cleanup for table contents or exact table boundary paragraphs', () => {
              const paragraphs = [
                p(1, '正文', 0, 10),
                p(2, '表1 四类风险客户清退积分规则', 11, 30),
                p(3, '', 31, 32),
                { ...p(4, '业务分类', 40, 50), tableIndex: 1 },
                p(5, '注：', 101, 110),
                p(6, '', 200, 201)
              ]
              const tables: TableModel[] = [{
                index: 1,
                rangeStart: 40,
                rangeEnd: 100,
                rowCount: 5,
                columnCount: 2,
                previousParagraphIndex: 3,
                nextParagraphIndex: 5
              }]

              const issues = new CleanupScanner().scan(doc(paragraphs, tables))
              expect(issues.some(issue => issue.paragraphIndex === 3)).toBe(false)
              expect(issues.some(issue => issue.paragraphIndex === 4)).toBe(false)
              expect(issues.some(issue => issue.paragraphIndex === 5)).toBe(false)
              expect(issues.some(issue => issue.paragraphIndex === 6)).toBe(true)
              expect(issues.every(issue => issue.safeAutoFix === false)).toBe(true)
            })

            it('executor ignores stale deletion requests targeting a protected table boundary', () => {
              const paragraphs = [p(1, '表1 标题', 0, 10), p(2, '', 11, 12), p(3, '', 100, 101)]
              const tables: TableModel[] = [{
                index: 1,
                rangeStart: 20,
                rangeEnd: 90,
                rowCount: 1,
                columnCount: 1,
                previousParagraphIndex: 2
              }]
              const d = doc(paragraphs, tables)
              const issues = [
                { id: 'boundary', type: 'blank-line', paragraphIndex: 2, originalText: '', suggestedText: '', enabled: true, safeAutoFix: false },
                { id: 'normal', type: 'blank-line', paragraphIndex: 3, originalText: '', suggestedText: '', enabled: true, safeAutoFix: false }
              ] as any

              const executor = new CleanupExecutor({} as any, {} as any)
              const changes = executor.buildExpectedChanges(d, issues)
              expect(changes.some(change => change.paragraphIndex === 2)).toBe(false)
              expect(changes.some(change => change.paragraphIndex === 3)).toBe(true)
            })

            it('one-click formatting contains no automatic cleanup call', () => {
              const source = readFileSync(resolve(process.cwd(), 'src/modules/wordFormatter/stores/wordFormatterStore.ts'), 'utf8')
              const block = source.match(/async executeSmartFormat\(\)[\s\S]*?\n\s*setSelectedTemplate/)
              expect(block).toBeTruthy()
              expect(block![0]).not.toContain('executeCleanup')
              expect(block![0]).toContain('automatic cleanup disabled')
            })
          })
          EOF

      - name: Validate
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/apply-v102-safety-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: protect table boundaries and disable automatic cleanup"
          git push origin HEAD:feature/v1.0.2
