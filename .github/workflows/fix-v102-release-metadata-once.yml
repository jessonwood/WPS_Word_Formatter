name: Fix v1.0.2 release metadata once

on:
  push:
    branches:
      - 'fix/v1.0.2-release-metadata'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/v1.0.2-release-metadata
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Align version metadata
        shell: bash
        run: |
          npm version 1.0.2 --no-git-tag-version
          python - <<'PY'
          from pathlib import Path

          manifest = Path('public/manifest.xml')
          manifest.write_text(manifest.read_text(encoding='utf-8').replace('<version>1.0.1</version>', '<version>1.0.2</version>'), encoding='utf-8')

          publish = Path('publish.xml')
          publish.write_text(publish.read_text(encoding='utf-8').replace('version="1.0.1"', 'version="1.0.2"').replace('WpsWordFormatter_1.0.1', 'WpsWordFormatter_1.0.2'), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          changelog.write_text(changelog.read_text(encoding='utf-8').replace('## [1.0.2] - Unreleased', '## [1.0.2] - 2026-08-18', 1), encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('`v1.0.1`', '`v1.0.2`', 1)
          text = text.replace('v1.0 聚焦“选模板/接受推荐 → 扫描 → 预览 → 一键整理并排版”的简单使用流程；高级设置仍保留但默认收起。', 'v1.0.2 聚焦“选模板/接受推荐 → 扫描 → 预览 → 一键排版”；自动排版不再执行任何文档清理，清理功能仅保留为用户显式手动操作。')
          readme.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-v102-release-metadata-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: prepare v1.0.2 release metadata"
          git push origin HEAD:fix/v1.0.2-release-metadata
