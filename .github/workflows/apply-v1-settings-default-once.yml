name: Apply v1 settings visibility once

on:
  push:
    branches: [feature/v1.0]
    paths: ['.github/workflows/apply-v1-settings-default-once.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0
      - name: Keep formatting choices visible by default
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/modules/wordFormatter/WordFormatterPage.vue')
          text = path.read_text(encoding='utf-8')
          old = 'const advancedExpanded = ref(false)'
          new = 'const advancedExpanded = ref(true)'
          if old not in text:
              raise SystemExit('Expected advancedExpanded default not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/apply-v1-settings-default-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/wordFormatter/WordFormatterPage.vue .github/workflows/apply-v1-settings-default-once.yml
          git commit -m 'fix: show formatting strategy and scope by default'
          git push origin feature/v1.0
