name: Apply v1.0 product changes once

on:
  push:
    branches: [feature/v1.0]
    paths: ['.github/workflows/apply-v1-once.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply v1.0 code changes
        shell: python
        run: |
          from pathlib import Path
          import json, re

          # ---------- Store: recommendation, extraction, simple one-click flow ----------
          path = Path('src/modules/wordFormatter/stores/wordFormatterStore.ts')
          s = path.read_text(encoding='utf-8')
          s = s.replace("import { logger } from '@/shared/logger/logger'", "import { logger } from '@/shared/logger/logger'\nimport { TemplateRecommendationEngine, type TemplateRecommendation } from '../core/recommendation/TemplateRecommendationEngine'\nimport { TemplateExtractionService } from '../core/templates/TemplateExtractionService'")
          s = s.replace("  diagnosticsReport: DiagnosticsReport | null\n", "  diagnosticsReport: DiagnosticsReport | null\n  templateRecommendation: TemplateRecommendation | null\n")
          s = s.replace("    diagnosticsReport: null,\n", "    diagnosticsReport: null,\n    templateRecommendation: null,\n")
          s = s.replace("        this.cleanupIssues = cleanupEngine.scan(model)\n\n        this.refreshBackups()", "        this.cleanupIssues = cleanupEngine.scan(model)\n        this.templateRecommendation = TemplateRecommendationEngine.recommend(model, results, this.allTemplates)\n\n        this.refreshBackups()")
          marker = "    setSelectedTemplate(id: string) {"
          insert = '''    applyRecommendedTemplate() {\n      if (!this.templateRecommendation) return\n      this.setSelectedTemplate(this.templateRecommendation.templateId)\n      logger.info('WordFormatterStore', `Applied recommended template: ${this.templateRecommendation.templateName}`)\n    },\n\n    extractTemplateFromCurrentDocument(): FormatTemplate | null {\n      if (!this.documentModel || this.recognitionResults.length === 0) {\n        this.errorMessage = '请先扫描当前文档，再提取模板'\n        return null\n      }\n      const extracted = TemplateExtractionService.extractAndSave(\n        this.documentModel,\n        this.effectiveRecognition,\n        this.selectedTemplate\n      )\n      this.refreshTemplates()\n      this.setSelectedTemplate(extracted.id)\n      logger.info('WordFormatterStore', `Extracted custom template from document: ${extracted.name}`)\n      return extracted\n    },\n\n    async executeSmartFormat() {\n      if (!this.documentModel) await this.scanDocument()\n      if (!this.documentModel) return\n\n      const safeIssues = this.cleanupIssues.filter(issue => issue.enabled && issue.safeAutoFix)\n      if (safeIssues.length > 0) {\n        logger.info('WordFormatterStore', `Smart flow: safely cleaning ${safeIssues.length} issue(s) before formatting`)\n        const cleanupResult = await this.executeCleanup(safeIssues)\n        if (!cleanupResult.success) return\n      }\n      await this.executeFormat()\n    },\n\n'''
          if marker not in s: raise SystemExit('store insertion marker missing')
          s = s.replace(marker, insert + marker, 1)
          path.write_text(s, encoding='utf-8')

          # ---------- Template selector: recommendation + extract current document ----------
          path = Path('src/modules/wordFormatter/components/TemplateSelector.vue')
          s = path.read_text(encoding='utf-8')
          s = s.replace("import { BookmarkCheck, SlidersHorizontal } from 'lucide-vue-next'", "import { BookmarkCheck, SlidersHorizontal, Sparkles, FileDown } from 'lucide-vue-next'")
          s = s.replace("const onSelectChange = (event: Event) => {", "const handleExtractTemplate = () => {\n  const tpl = store.extractTemplateFromCurrentDocument()\n  if (tpl) emit('open-editor')\n}\n\nconst onSelectChange = (event: Event) => {")
          anchor = '''    <div class="select-wrapper">'''
          recommendation = '''    <div v-if="store.templateRecommendation" class="recommend-box">\n      <div class="recommend-main">\n        <Sparkles class="w-4 h-4 text-amber-500" />\n        <div>\n          <div class="recommend-title">推荐：{{ store.templateRecommendation.templateName }}</div>\n          <div class="recommend-reason">{{ store.templateRecommendation.reasons.join(' · ') }}</div>\n        </div>\n      </div>\n      <button\n        v-if="store.selectedTemplateId !== store.templateRecommendation.templateId"\n        class="btn-use-recommend"\n        @click="store.applyRecommendedTemplate()"\n      >使用推荐</button>\n      <span v-else class="recommend-used">已使用</span>\n    </div>\n\n'''
          if anchor not in s: raise SystemExit('template selector anchor missing')
          s = s.replace(anchor, recommendation + anchor, 1)
          old_button = '''      <button class="btn-config" @click="emit('open-editor')" title="自定义与管理模板参数">\n        <SlidersHorizontal class="w-3.5 h-3.5" />\n        <span>模板详情</span>\n      </button>'''
          new_button = '''      <div class="template-actions">\n        <button class="btn-config" @click="handleExtractTemplate" title="从当前文档已识别的格式生成一个自定义模板">\n          <FileDown class="w-3.5 h-3.5" />\n          <span>提取模板</span>\n        </button>\n        <button class="btn-config" @click="emit('open-editor')" title="自定义与管理模板参数">\n          <SlidersHorizontal class="w-3.5 h-3.5" />\n          <span>模板详情</span>\n        </button>\n      </div>'''
          if old_button not in s: raise SystemExit('template button marker missing')
          s = s.replace(old_button, new_button, 1)
          s += '''\n<style scoped>\n.template-actions { display:flex; gap:6px; }\n.recommend-box { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 10px; margin-bottom:8px; border:1px solid #fde68a; background:#fffbeb; border-radius:8px; }\n.recommend-main { display:flex; align-items:flex-start; gap:6px; min-width:0; }\n.recommend-title { font-size:11.5px; font-weight:700; color:#92400e; }\n.recommend-reason { font-size:10px; color:#a16207; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:420px; }\n.btn-use-recommend { flex-shrink:0; border:1px solid #f59e0b; background:#fff; color:#b45309; border-radius:6px; padding:4px 8px; font-size:10.5px; cursor:pointer; }\n.recommend-used { flex-shrink:0; color:#15803d; font-size:10.5px; font-weight:600; }\n</style>\n'''
          path.write_text(s, encoding='utf-8')

          # ---------- Main page: simple default flow, advanced options collapsed ----------
          path = Path('src/modules/wordFormatter/WordFormatterPage.vue')
          s = path.read_text(encoding='utf-8')
          s = s.replace("import { wpsWriterAdapter } from './adapters/WpsWriterAdapter'", "import { defaultWriterAdapter } from './adapters/adapterFactory'")
          s = s.replace("const copySuccessToast = ref<string | null>(null)", "const copySuccessToast = ref<string | null>(null)\nconst advancedExpanded = ref(false)")
          s = s.replace("const handleExecuteFormat = async () => {\n  await store.executeFormat()", "const handleExecuteFormat = async () => {\n  await store.executeSmartFormat()")
          s = s.replace("default: return store.formatStrategy === 'minimal' ? '一键最小修复排版' : '一键完整标准化排版'", "default: return '一键整理并排版'")
          s = s.replace('        <!-- 6. Advanced format options -->\n        <FormatOptions />\n\n        <!-- 7. Automatic Table of Contents (TOC) -->\n        <TocSettings />', '''        <!-- 6. Advanced options: hidden by default for a simple user flow -->\n        <button class="btn-advanced-toggle" @click="advancedExpanded = !advancedExpanded">\n          <Settings class="w-3.5 h-3.5" />\n          <span>{{ advancedExpanded ? '收起更多设置' : '更多设置' }}</span>\n        </button>\n        <div v-if="advancedExpanded" class="advanced-panel">\n          <FormatOptions />\n          <TocSettings />\n        </div>''')
          s = s.replace('      <div class="strategy-bar">', '      <div v-if="advancedExpanded" class="strategy-bar">')
          s = s.replace('      <div class="scope-bar">', '      <div v-if="advancedExpanded" class="scope-bar">')
          s = s.replace(':adapter="wpsWriterAdapter"', ':adapter="defaultWriterAdapter"')
          # Make primary action wording plain and outcome-oriented.
          s = s.replace('title="生成并查看预计修改清单，不修改文档"', 'title="先看会修改哪些格式，不修改文档"')
          style_marker = '<style scoped>'
          if style_marker not in s: raise SystemExit('page style marker missing')
          s = s.replace(style_marker, '''<style scoped>\n.btn-advanced-toggle { width:100%; display:flex; align-items:center; justify-content:center; gap:5px; padding:7px; border:1px dashed #cbd5e1; background:#f8fafc; color:#64748b; border-radius:8px; cursor:pointer; font-size:11px; }\n.btn-advanced-toggle:hover { color:#2563eb; border-color:#93c5fd; background:#eff6ff; }\n.advanced-panel { display:flex; flex-direction:column; gap:8px; }\n''', 1)
          path.write_text(s, encoding='utf-8')

          # ---------- Remove synthetic fallback from legacy WPS adapter ----------
          path = Path('src/modules/wordFormatter/adapters/WpsWriterAdapter.ts')
          s = path.read_text(encoding='utf-8')
          # Remove mockDoc declaration as one block.
          s = re.sub(r"\n  // Fallback in-memory mock document for standalone browser preview / testing\n  private mockDoc = \{.*?\n  \}\n\n  private getDoc", "\n\n  private getDoc", s, count=1, flags=re.S)
          s = s.replace("    return !!doc || true // In standalone fallback returns true with mock", "    return !!doc")
          s = re.sub(r"    if \(!doc\) \{\n      // Mock environment return\n      return \{.*?\n      \}\n    \}", "    if (!doc) return null", s, count=1, flags=re.S)
          s = re.sub(r"    if \(!doc\) \{\n      // Fallback mock paragraphs\n      return this\.mockDoc\.paragraphs\.map\(.*?\n      \}\)\n    \}", "    if (!doc) return []", s, count=1, flags=re.S)
          # Read-only fallbacks become empty/explicit failure, never synthetic data.
          s = re.sub(r"    if \(!doc\) \{\n      return \[\{\n        index: 1,\n        rangeStart: 1400,.*?\n      \}\]\n    \}", "    if (!doc) return []", s, count=1, flags=re.S)
          s = re.sub(r"    if \(!doc\) \{\n      return \[\{\n        index: 1,\n        pageWidth: 595\.3,.*?\n      \}\]\n    \}", "    if (!doc) return []", s, count=1, flags=re.S)
          s = s.replace("    if (!doc) {\n      return calculateTextSignature(this.mockDoc.paragraphs.map(p => p.text))\n    }", "    if (!doc) {\n      throw new WordFormatterError({ code: 'WF001', message: '未检测到活动 WPS 文字文档', moduleName: 'WpsWriterAdapter' })\n    }")
          # No-op mock mutation branches -> explicit errors.
          s = re.sub(r"    if \(!doc\) \{\n      logger\.info\('WpsWriterAdapter', `?[^\n]*Mock[^\n]*\n(?:      [^\n]*\n)*?      return\n    \}", "    if (!doc) throw new WordFormatterError({ code: 'WF001', message: '未检测到活动 WPS 文字文档', moduleName: 'WpsWriterAdapter' })", s)
          s = re.sub(r"    if \(!doc\) \{\n      logger\.info\('WpsWriterAdapter', '[^\n]*Mock[^\n]*\n      return\n    \}", "    if (!doc) throw new WordFormatterError({ code: 'WF001', message: '未检测到活动 WPS 文字文档', moduleName: 'WpsWriterAdapter' })", s)
          # Remaining direct no-document no-op in mutating methods are protected by production adapter; remove Mock wording globally.
          s = s.replace('Mock apply', 'Unavailable host: apply')
          path.write_text(s, encoding='utf-8')

          # Production adapter comment no longer describes legacy fallback as an accepted design.
          path = Path('src/modules/wordFormatter/adapters/ProductionWpsWriterAdapter.ts')
          s = path.read_text(encoding='utf-8')
          s = s.replace(" * The legacy WpsWriterAdapter still contains browser-development fallback behavior.\n * Production code must use this wrapper so a missing WPS document is reported as an\n * error instead of silently falling back to synthetic/mock document data.", " * Production code uses this strict guard layer. Browser development uses the isolated\n * MockWriterAdapter selected only by adapterFactory outside the WPS host.")
          path.write_text(s, encoding='utf-8')

          # ---------- Version metadata ----------
          pkg = json.loads(Path('package.json').read_text(encoding='utf-8'))
          pkg['version'] = '1.0.0'
          Path('package.json').write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          manifest = Path('public/manifest.xml')
          manifest.write_text(manifest.read_text(encoding='utf-8').replace('0.9.0-beta.2', '1.0.0').replace('（Beta）', ''), encoding='utf-8')
          publish = Path('publish.xml')
          publish.write_text(publish.read_text(encoding='utf-8').replace('0.9.0-beta.2', '1.0.0'), encoding='utf-8')

          # README / changelog positioning.
          readme = Path('README.md')
          t = readme.read_text(encoding='utf-8')
          t = t.replace('`v0.9.0-beta.2`', '`v1.0.0`', 1)
          t = t.replace('当前版本已具备个人生产使用所需的主要能力，但在公开发布阶段仍定位为 Beta，等待更多不同 WPS 版本、不同文档类型和不同机器环境的真实验证。', 'v1.0 聚焦“选模板/接受推荐 → 扫描 → 预览 → 一键整理并排版”的简单使用流程；高级设置仍保留但默认收起。')
          readme.write_text(t, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          t = changelog.read_text(encoding='utf-8')
          entry = '''## [1.0.0] - 2026-08-17\n\n### Added\n- 离线模板智能推荐：根据标题编号、章节结构与文档关键词推荐最合适的内置模板。\n- 标题编号连续性、重复编号与标题层级跳级检查在结构体检中集中呈现。\n- 一键整理并排版：优先执行安全清理项，再进入备份、排版与完整性校验。\n- 从当前文档提取自定义模板：复用已识别的主标题、多级标题、正文与页面样式。\n\n### Changed\n- 首页默认流程简化为模板/推荐、扫描、预览和一键排版；高级策略、范围与目录选项默认收进“更多设置”。\n- WPS 生产适配路径不再允许 synthetic/mock 文档兜底；浏览器预览只使用独立 MockWriterAdapter。\n- 版本正式进入 v1.0.0。\n\n'''
          marker = 'All notable changes to this project will be documented here.\n\n'
          if '## [1.0.0]' not in t: t = t.replace(marker, marker + entry, 1)
          changelog.write_text(t, encoding='utf-8')

          # Remove this one-time workflow from final source tree.
          Path('.github/workflows/apply-v1-once.yml').unlink()

      - name: Sync package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify source boundaries
        shell: python
        run: |
          from pathlib import Path
          s = Path('src/modules/wordFormatter/adapters/WpsWriterAdapter.ts').read_text(encoding='utf-8')
          assert 'mockDoc' not in s
          assert '|| true' not in s
          assert '2026年小微企业信贷风险管理报告' not in s
          factory = Path('src/modules/wordFormatter/adapters/adapterFactory.ts').read_text(encoding='utf-8')
          assert 'mockWriterAdapter' in factory and 'productionWpsWriterAdapter' in factory

      - name: Validate v1.0
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm test
          npm run build

      - name: Commit v1.0 implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete v1.0 simple document formatting workflow"
          git push origin HEAD:feature/v1.0
